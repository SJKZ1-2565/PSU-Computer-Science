name: C/C++ CI

on:
  push:
    branches: [ "1-2568(2025)" ]
  pull_request:
    branches: [ "1-2568(2025)" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compile
        working-directory: "CPP/First-year student/Summer"
        run: g++ *.cpp -o main

      - name: Run
        working-directory: "CPP/First-year student/Summer"
        run: ./main
