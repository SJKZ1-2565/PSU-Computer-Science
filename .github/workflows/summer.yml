name: 🌞 Summer

on:
  # push:
  #   branches: [ "1-2568(2025)" ]
  # pull_request:
  #   branches: [ "1-2568(2025)" ]
  workflow_dispatch:
    inputs:
      program_input:
        description: "Input สำหรับโปรแกรม (แต่ละค่าขึ้นบรรทัดใหม่)"
        required: true
        default: "5\n10"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compile
        working-directory: "CPP/First-year student/Summer"
        run: g++ *.cpp -o main

      - name: Run
        working-directory: "CPP/First-year student/Summer"
        run: echo -e "${{ github.event.inputs.program_input }}" | ./main
